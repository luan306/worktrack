# frontend/nginx.conf
# Chạy bên trong container frontend — proxy sang service "backend" bằng TÊN
# SERVICE trong docker-compose (Docker tự phân giải DNS nội bộ), không phải
# 127.0.0.1 như khi chạy Nginx trực tiếp trên máy thật.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén file tĩnh (JS/CSS của app ~ vài trăm KB → còn khoảng 1/3–1/4) — nhiều người mở cùng lúc
    # qua mạng nội bộ / VPN tải nhanh hơn hẳn. (JSON của /api do backend tự nén.)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # File build của Vite có mã băm trong tên (đổi nội dung = đổi tên) → trình duyệt giữ 1 năm,
    # lần mở sau không phải tải lại. Thiếu file thì trả 404 thật, không trả index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html KHÔNG được cache: sau mỗi lần cập nhật, mọi người phải nhận ngay bản mới
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;   # bắt buộc cho React Router (SPA)
    }

    location /api/ {
        # Giữ nguyên tiền tố /api khi chuyển sang backend — mọi route của backend đều nằm dưới /api
        # (app.use('/api', ...)). Viết "http://backend:3001/;" sẽ CẮT mất /api → backend trả 404.
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
    }

    client_max_body_size 20M;
}
